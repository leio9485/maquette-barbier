<!--# --------------------------------------------------------------------------
   LE SQUELETTE DE LA PAGE D'ANNULATION.

   Le second document du site. Même mécanique que index.html — des `@inclure`
   recollés à l'envoi, aucune étape de construction — mais un document à part,
   et c'est délibéré :

     • on y arrive depuis un courriel, sans être passé par la vitrine, souvent
       des semaines après l'avoir vue ;
     • on n'y fait qu'une chose, et elle tient en deux champs.

   Lui servir la vitrine entière — la galerie, le tunnel, l'espace commerçant —
   pour n'en montrer qu'un formulaire reviendrait à faire télécharger cent
   cinquante kilo-octets pour en utiliser trois.

   ⚠️ IL NE PARTAGE QUE DES MORCEAUX, jamais un résultat : chaque document a
      son propre cache d'assemblage (src/lib/assemblage.js).

   ⚠️ LES STYLES SONT CHOISIS, PAS RECOPIÉS. Cette page n'a ni rail, ni galerie,
      ni agenda : leurs feuilles ne sont pas incluses. En ajouter une pour
      « avoir tout sous la main » annulerait la raison d'être de ce fichier.
   -------------------------------------------------------------------------- #-->

<!--# CETTE PAGE NE S'INDEXE PAS, et l'en-tête `X-Robots-Tag` posé par le
     serveur le dit aussi (src/server.js). Deux raisons : elle n'a aucun
     contenu à offrir à un moteur de recherche, et une adresse d'annulation
     qui remonte dans les résultats est une invitation à s'y perdre pour qui
     cherchait simplement le salon. Elle reste parfaitement accessible : c'est
     l'indexation qu'on refuse, pas la lecture. #-->
<meta name="robots" content="noindex, follow">
