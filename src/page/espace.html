<!--# --------------------------------------------------------------------------
   LE SQUELETTE DE L'ESPACE COMMERÇANT — /espace-salon.

   Le troisième document du site, et celui qui change le plus la vitrine :
   tout ce balisage y vivait, et partait chez CHAQUE visiteur.

   Mesuré avant la séparation : 58 154 octets sur 164 244, soit 35 % du DOM
   d'une page de barbier occupés par un agenda que le visiteur ne verra jamais.
   Ce n'était pas une fuite — les conteneurs sont vides, et les rendez-vous ne
   sortent que de /api/admin/… derrière une session — mais c'était du poids, du
   JavaScript à analyser, et un bouton « Espace commerçant » offert à tout le
   monde en bas de page.

   ⚠️ CE DOCUMENT NE CONTIENT PAS LA VITRINE, et l'inverse est vrai depuis le
      même commit. Les deux ne partagent que des morceaux — jetons, fondations,
      contrôles, utilitaires — jamais un résultat : chacun a son propre cache
      d'assemblage (src/lib/assemblage.js).

   ⚠️ LES STYLES SONT CHOISIS, PAS RECOPIÉS. Ni accueil, ni galerie, ni tunnel,
      ni bandeau d'état. Ce qui est ici est ce dont l'espace se sert.

   ⚠️ IL N'Y A PLUS DE BASCULE ENTRE DEUX VUES. Avant, `afficherEspace(true)`
      masquait la vitrine et montrait l'agenda dans le même document. Ici,
      « Voir le site » est un lien vers `/` — c'est-à-dire une vraie
      navigation, avec un bouton « précédent » qui fonctionne.
   -------------------------------------------------------------------------- #-->
