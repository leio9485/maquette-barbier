<!--# --------------------------------------------------------------------------
   LE SQUELETTE DE LA PAGE — l'ordre des morceaux, et rien d'autre.

   Ce fichier ne contient volontairement AUCUN style, AUCUN script, et presque
   aucun balisage : il dit dans quel ordre les morceaux de src/page/ se
   recollent. C'est la table des matières du site — on l'ouvre pour savoir où
   aller, pas pour modifier.

   Un morceau s'appelle par `@inclure`, dans la forme du langage qui l'entoure :

       <!--@inclure parties/galerie.html-->     dans le HTML
       /*@inclure styles/08-accueil.css*/       dans le <style>
       /*@inclure js/07-tunnel.js*/             dans le <script>

   Le recollage se fait à chaque envoi de la page, côté serveur
   (src/lib/assemblage.js). AUCUNE ÉTAPE DE CONSTRUCTION : on modifie un
   morceau, on recharge la page. Le navigateur reçoit une seule page, un seul
   style, un seul script.

   ⚠️ L'ORDRE DES `@inclure` COMPTE. Pour le CSS, c'est l'ordre de la cascade :
      deux règles de même spécificité sont départagées par la dernière écrite.
      Pour le JavaScript, la politique Trusted Types (00) doit rester la toute
      première instruction, et le démarrage (11) la dernière.

   ⚠️ Les commentaires de cette forme — `<!--#` — sont RETIRÉS de la page
      envoyée. Les commentaires HTML ordinaires, eux, partent chez le visiteur :
      deux d'entre eux marquent les zones que le serveur remplace.
   -------------------------------------------------------------------------- #-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--# La couleur de la barre du navigateur sur téléphone : celle du bandeau
     d'état, qui est collé juste en dessous. Toute autre valeur ferait une
     couture visible en haut de l'écran. #-->
<meta name="theme-color" content="#16191B">
<!--# L'icône d'onglet : le rail et trois lignes de contenu — la structure même
     de la page, réduite à 16 pixels. Aucune lettre : un monogramme dans un
     médaillon est le premier réflexe de tous les sites de barbier, et il ne se
     lit de toute façon pas à cette taille. #-->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316191B'/%3E%3Crect x='10' y='14' width='6' height='36' fill='%2324405C'/%3E%3Crect x='26' y='14' width='28' height='6' fill='%23EFEEEA'/%3E%3Crect x='26' y='29' width='28' height='6' fill='%23EFEEEA'/%3E%3Crect x='26' y='44' width='20' height='6' fill='%23EFEEEA'/%3E%3C/svg%3E">
<!--# L'ICONE DE L'ECRAN D'ACCUEIL. iOS ne lit ni le SVG ci-dessus ni le
     manifeste pour ce role : il ne regarde que `apple-touch-icon`, en PNG.
     Sans elle, « Ajouter à l'écran d'accueil » donnait un carré vide — sur un
     outil de prise de rendez-vous, c'est-à-dire sur le raccourci que le client
     garde sous les yeux. Dessinée par le serveur (src/lib/icones.js). #-->
<link rel="apple-touch-icon" href="/icone-180.png">

<!--# LE MANIFESTE — nom, couleurs et icônes du site posé sur un écran
     d'accueil. Il répondait 404. Le nom qu'il porte vient des réglages, jamais
     d'une chaîne en dur : chez un client, c'est le nom de sa boutique qui
     s'affiche sous l'icône. #-->
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary">

<!-- Tout ce qui suit, jusqu'au marqueur de fermeture, est REMPLACÉ par le
     serveur à chaque envoi de la page, avec les réglages réels du commerce
     (src/lib/page.js). Les valeurs ci-dessous ne servent que de contenu de
     secours : c'est ce qu'affiche le fichier ouvert sans serveur.
     Ne pas retirer les deux marqueurs — sans eux, l'en-tête cesse de suivre les
     réglages, sans que rien ne le signale. -->
<!--@reglages-->
<title>L'Établi — Barbier à Bavay</title>
<meta name="description" content="L'Établi, barbier à Bavay : coupe, barbe, rasage au coupe-chou. Réservez votre créneau en ligne, à toute heure.">
<meta property="og:title" content="L'Établi — Barbier à Bavay">
<meta property="og:description" content="Coupe, barbe, rasage au coupe-chou. Réservez votre créneau en ligne, à toute heure.">
<!--/@reglages-->
<!--# Les polices sont servies par ce site (public/fonts/), jamais par Google :
     ni preconnect, ni feuille de style extérieure bloquant le rendu, et aucune
     requête partie chez un tiers — c'est une obligation RGPD autant qu'une
     question de vitesse.
     Seules les deux polices du premier écran sont préchargées : le titre
     d'accueil et le texte courant. Les deux autres se chargent quand le CSS les
     réclame, et `font-display:swap` fait que rien n'attend après elles. #-->
<link rel="preload" href="/fonts/plexcond-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plexsans-400.woff2" as="font" type="font/woff2" crossorigin>
