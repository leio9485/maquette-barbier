<!--# ---------------------------------------------------------------------------
   LA GALERIE — quatre photos, à leur taille utile.

   AUCUNE VISIONNEUSE AU CLIC. Ouvrir l'image en grand sur fond noir demande du
   code, un piège à focus pour le clavier, une touche Échap, et n'apporte rien :
   les photos sont déjà affichées assez grand pour ce qu'elles montrent. C'est
   une fonctionnalité qu'on ajoute par réflexe, pas par besoin.

   Les cadrages sont imposés (3:4) et les images recadrées : les photos d'un
   vrai client, quelles qu'elles soient, ne pourront pas casser la rangée.
   --------------------------------------------------------------------------- #-->
<section class="bloc" id="galerie">
  <div class="bloc-corps">

    <div class="rail">
      <p class="etiquette"><span class="rail-numero">04</span> Galerie</p>
    </div>

    <div class="contenu">
      <h2>L'atelier</h2>

      <!--# ⚠️ `<figure>` ET `<figcaption>`, PAS UN `<div>` ET UN `<p>`.
           C'étaient des `<p>` posés à côté d'images sans `alt` : rien ne
           disait que ce texte légendait CETTE image-là. Un lecteur d'écran
           annonçait donc quatre images muettes, puis quatre bouts de phrase
           sans objet. `<figure>` est exactement la balise qui lie les deux,
           et elle ne coûte rien.

           ⚠️ L'`alt` DÉCRIT L'IMAGE, IL NE REPREND PAS LA LÉGENDE. « La
              devanture » sous la photo et « La devanture » dans l'attribut,
              c'est la même information dite deux fois. Les valeurs livrées
              sont dans src/lib/photos.js, et le commerçant écrit les siennes
              depuis les réglages. #-->
      <ul class="galerie" id="galerie">
        <li class="galerie-case" data-photo="galerie-1">
          <figure>
            <img alt="" width="700" height="933" loading="lazy" hidden>
            <figcaption class="galerie-legende etiquette" data-legende="galerie-1">La devanture</figcaption>
          </figure>
        </li>
        <li class="galerie-case" data-photo="galerie-2">
          <figure>
            <img alt="" width="700" height="933" loading="lazy" hidden>
            <figcaption class="galerie-legende etiquette" data-legende="galerie-2">Le poste</figcaption>
          </figure>
        </li>
        <li class="galerie-case" data-photo="galerie-3">
          <figure>
            <img alt="" width="700" height="933" loading="lazy" hidden>
            <figcaption class="galerie-legende etiquette" data-legende="galerie-3">La coupe</figcaption>
          </figure>
        </li>
        <li class="galerie-case" data-photo="galerie-4">
          <figure>
            <img alt="" width="700" height="933" loading="lazy" hidden>
            <figcaption class="galerie-legende etiquette" data-legende="galerie-4">Le rasage</figcaption>
          </figure>
        </li>
      </ul>
    </div>

  </div>
</section>
