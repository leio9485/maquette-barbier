<!--# ---------------------------------------------------------------------------
   LE PIED DE PAGE.

   Trois choses, et rien d'autre : le nom, les obligations légales, et l'entrée
   de l'espace commerçant. Pas de second sommaire, pas de « suivez-nous », pas
   de formulaire d'inscription à une lettre d'information qui n'existe pas.
   --------------------------------------------------------------------------- #-->
<footer class="pied sombre">
  <div class="pied-corps">

    <p class="pied-marque">
      <span class="pied-nom" data-champ="nom">L'Établi</span>
      <span class="donnee pied-lieu">Barbier <span aria-hidden="true">·</span> <span data-champ="ville">Bavay</span></span>
    </p>

    <!--# ⚠️ DE VRAIS LIENS, PAS DES BOUTONS (lot D, point D3). Ils ouvraient
         une surimpression sans la moindre adresse : ni partageables, ni
         indexables, ni ouvrables dans un nouvel onglet. `data-legal` reste
         posé — le JavaScript l'utilise toujours pour intercepter le clic et
         éviter un rechargement quand la page est déjà là
         (`ouvrirLegalDepuisLien()`, js/05-navigation.js) — mais `href` fait
         de chacun un vrai lien pour qui n'exécute pas de code, ou qui veut
         l'ouvrir à part. #-->
    <nav class="pied-liens etiquette" aria-label="Informations légales">
      <a class="lien-nu" href="/mentions-legales" data-legal="mentions">Mentions légales</a>
      <a class="lien-nu" href="/confidentialite" data-legal="confidentialite">Confidentialité</a>
      <!--# ⚠️ CE LIEN N'EXISTE QUE SUR LA DÉMONSTRATION. Il est retiré du
           document par le serveur quand DEMO_MODE est absent (src/lib/page.js),
           et pas seulement masqué : un bouton caché reste dans la source.

           Chez un vrai client, le commerçant arrive par l'adresse directe
           `/espace-salon`, mise en raccourci sur son écran d'accueil. Il ne la
           tape presque jamais — la session se renouvelle à l'usage. Afficher
           l'entrée de son agenda en bas de sa vitrine n'apporte rien à ses
           clients et donne une porte à essayer à tous les autres.

           C'est un vrai lien, pas un bouton : il emmène quelque part. Le
           « précédent » du navigateur fonctionne, on peut l'ouvrir dans un
           onglet, et le mettre en favori. #-->
      <!--@espace-lien-->
      <a class="lien-nu" id="lienEspace" href="/espace-salon">Espace commerçant</a>
      <!--/@espace-lien-->
    </nav>

  </div>
</footer>
